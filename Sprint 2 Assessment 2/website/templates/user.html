{% extends "base.html" %}
{% from "bootstrap5/form.html" import render_form %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white"><h4 class="mb-0">{{ heading }}</h4></div>
            <div class="card-body">{{ render_form(form) }}</div>
        </div>
        {% if heading == 'Login' %}
        <div class="text-center mt-3"><p>New user? <a href="{{ url_for('auth.register') }}">Click here</a> to register.</p></div>
        {% endif %}
    </div>
</div>
{% endblock %}
