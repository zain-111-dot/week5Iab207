<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Gaming Event</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="static/style/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Gaming Events Hub</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="event.html">Event Details</a></li>
        <li class="nav-item"><a class="nav-link" href="history.html">Booking History</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container my-4">
  <h2>Create Gaming Event</h2>
  <form class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Event Name</label>
      <input type="text" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Category</label>
      <select class="form-select">
        <option>FPS</option>
        <option>MOBA</option>
        <option>RPG</option>
        <option>Fighting</option>
      </select>
    </div>
    <div class="col-12">
      <label class="form-label">Description</label>
      <textarea class="form-control" rows="3"></textarea>
    </div>
    <div class="col-md-4">
      <label class="form-label">Date</label>
      <input type="date" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">Start Time</label>
      <input type="time" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">End Time</label>
      <input type="time" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Venue</label>
      <input type="text" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Tickets Available</label>
      <input type="number" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Image URL</label>
      <input type="text" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Acknowledgement of Country</label>
      <select class="form-select">
        <option>None</option>
        <option>Generic</option>
        <option>Enhanced</option>
      </select>
    </div>
    <div class="col-12">
      <button type="button" class="btn btn-primary">Create Event</button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
